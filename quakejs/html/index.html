<!DOCTYPE html>
<html>
	<head>
		<title>QuakeJS Local</title>
		<link rel="stylesheet" href="game.css"></link>
		<script type="text/javascript" src="ioquake3.js"></script>
		<script type="text/javascript">
			function getQueryCommands() {
				var search = /([^&=]+)/g;
				var query  = window.location.search.substring(1);

				var args = [];

				var match;
				while (match = search.exec(query)) {
					var val = decodeURIComponent(match[1]);
					val = val.split(' ');
					val[0] = '+' + val[0];
					args.push.apply(args, val);
				}

				return args;
			}

			window.onload = function () {
				function resizeViewport() {
					if (!ioq3.canvas) {
						// ignore if the canvas hasn't yet initialized
						return;
					}
					if ((document['webkitFullScreenElement'] || document['webkitFullscreenElement'] ||
								document['mozFullScreenElement'] || document['mozFullscreenElement'] ||
								document['fullScreenElement'] || document['fullscreenElement'])) {
						// ignore resize events due to going fullscreen
						return;
					}
					ioq3.setCanvasSize(ioq3.viewport.offsetWidth, ioq3.viewport.offsetHeight);
				}

				ioq3.viewport = document.getElementById('viewport-frame');
				ioq3.elementPointerLock = true;
				ioq3.exitHandler = function (err) {
					if (err) {
						alert(err);
					}
					window.location.href = '/';
				};

				window.addEventListener('resize', resizeViewport);

				// merge default args with query string args
				var url = new URL(window.location.href);
				var port = url.port || (url.protocol === "https:" ? "443" : "80");
				var connectAddr = url.hostname + ":" + port;
				var args = ['+set', 'fs_cdn', connectAddr, '+connect', connectAddr];
				args.push.apply(args, getQueryCommands());
				ioq3.callMain(args);
			};
		</script>
		<script type="text/javascript">
			// Surface the project source URL on the demo EULA screen.
			// GPLv2 section 3 asks that anyone receiving the software can find the
			// corresponding source; this is the first screen a player sees.
			//
			// Injected from here rather than edited into ioquake3.js on purpose:
			// that file is the GPL-covered Emscripten engine build, so editing it
			// would need a change notice under GPLv2 section 2(a), and the edit
			// would be lost the next time the build is re-vendored from upstream.
			(function () {
				var SOURCE_URL = 'https://github.com/JackBrenn/quakejs-rootless';

				function addSourceLink() {
					var inner = document.getElementById('eula-frame-inner');
					if (!inner || document.getElementById('source-link')) {
						return false;
					}

					var p = document.createElement('p');
					p.id = 'source-link';

					var a = document.createElement('a');
					a.href = SOURCE_URL;
					a.target = '_blank';
					a.rel = 'noopener';
					a.textContent = 'github.com/JackBrenn/quakejs-rootless';

					p.appendChild(document.createTextNode('Server software: '));
					p.appendChild(a);
					p.appendChild(document.createTextNode(
						' \u2014 container packaging of QuakeJS by Anthony Pesch, ' +
						'engine derived from ioquake3, GPL-2.0-or-later. ' +
						'Game content is id Software and third-party data under ' +
						'their own terms, not GPL.'));
					inner.appendChild(p);
					return true;
				}

				if (addSourceLink()) {
					return;
				}

				var observer = new MutationObserver(function () {
					if (addSourceLink()) {
						observer.disconnect();
					}
				});

				observer.observe(document.documentElement, {
					childList: true,
					subtree: true
				});
			})();
		</script>
	</head>
	<body>
		<div id="viewport-frame"></div>
	</body>
</html>
