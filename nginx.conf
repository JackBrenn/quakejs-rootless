# Run as non-root user
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use /tmp for nginx temporary files (writable by non-root)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    # The 3.9 MB engine shrinks to about 1 MB. Game data is already compressed.
    gzip on;
    gzip_types application/javascript application/json text/css;

    # Log to stdout/stderr so logs are visible via `docker logs` and
    # picked up by container log collectors (they do not read files
    # inside the container).
    access_log /dev/stdout;
    error_log  /dev/stderr notice;

    server {
        listen 8080;
        listen [::]:8080;   # Podman forwards localhost (::1) to the container over IPv6
        root /srv/www;

        server_tokens off;
        # Browsers revalidate (cheap 304s) so players never run a stale client after an upgrade.
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # The engine needs eval and injects its own <style> element and data: font.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location / {
            # Safely check if this is a WebSocket request (the game client)
            error_page 418 = @websocket;
            if ($http_upgrade ~* "^websocket$") {
                return 418;
            }
            try_files $uri $uri/ =404;
        }

        location @websocket {
            # Proxy WebSocket game connections to the dedicated server
            proxy_pass http://127.0.0.1:27960;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
