# Run as non-root user
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use /tmp for nginx temporary files (writable by non-root)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Log to stdout/stderr so logs are visible via `docker logs` and
    # picked up by container log collectors (they do not read files
    # inside the container).
    access_log /dev/stdout;
    error_log  /dev/stderr notice;

    # Only set CSP upgrade header when behind HTTPS proxy
    map $http_x_forwarded_proto $csp_header {
        "https"  "upgrade-insecure-requests";
        default  "";
    }

    server {
        listen 8080;
        server_name _;

        root /home/nonroot/www;
        index index.html;

        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            # Safely check if this is a WebSocket request (the game client)
            error_page 418 = @websocket;
            if ($http_upgrade ~* "^websocket$") {
                return 418;
            }
            try_files $uri $uri/ =404;
        }

        location @websocket {
            # Proxy WebSocket game connections to the dedicated server
            proxy_pass http://127.0.0.1:27960;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Disable directory listing
        autoindex off;
        add_header Content-Security-Policy $csp_header always;
    }
}
