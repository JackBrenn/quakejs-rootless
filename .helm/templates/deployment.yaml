apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quake.fullname" . }}
  labels:
    {{- include "quake.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "quake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.quake.serverConfig | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quake.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: quake
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FS_GAME
              value: {{ .Values.quake.fsGame | quote }}
          ports:
            - name: http-game
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The root filesystem is read-only: nginx writes to /tmp and the
          # game server downloads its game data into /quakejs/base.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: game-data
              mountPath: /quakejs/base
            {{- if .Values.quake.serverConfig }}
            - name: server-config
              mountPath: /etc/quakejs/server.cfg
              subPath: server.cfg
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: game-data
          emptyDir: {}
        {{- if .Values.quake.serverConfig }}
        - name: server-config
          configMap:
            name: {{ include "quake.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
