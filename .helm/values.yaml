image:
  repository: ghcr.io/jackbrenn/quakejs-rootless
  pullPolicy: IfNotPresent
  # Published charts pin the release's version@digest here.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: quake.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: quake-example-com-tls
  #    hosts:
  #      - quake.example.com

quake:
  fsGame: baseq3   # or cpma
  # Replaces the image's server.cfg when set, e.g.
  # serverConfig: |
  #   seta sv_hostname "My server"
  #   map q3dm17
  serverConfig: ""

resources: {}

startupProbe:
  httpGet:
    path: /
    port: http-game
  periodSeconds: 2
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /
    port: http-game
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: http-game
  initialDelaySeconds: 30
  periodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
