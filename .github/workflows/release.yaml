name: Release

# Every push to master publishes a release: the workflow works out the next
# version, tags it, builds, signs and publishes the image and the chart.
#
# The tag is an OUTPUT here, not a prerequisite. It exists so a published
# version can be traced back to a point in git history; you never create one
# by hand.
#
# To land a commit without cutting a release, put [skip release] in the
# commit message.

on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'nginx.conf'
      - 'server.cfg'
      - 'COPYING'
      - 'LICENSE.MIT'
      - 'README.md'
      - 'include/**'
      - 'quakejs/**'
      - '.helm/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increment'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Or pin an exact version, e.g. 1.2.0 (overrides the bump)'
        required: false
        type: string

concurrency:
  group: release
  # Never cancel a release mid-publish: a cancelled run can leave a pushed
  # image unsigned and unattested.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-tag:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required to push the new tag
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute and push the next tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
          else
            # Highest existing vX.Y.Z, ignoring pre-releases so an rc can never
            # become the base for the next stable version.
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
                     | grep -Ev -- '-' \
                     | sed 's/^v//' \
                     | sort -V \
                     | tail -n1)
            latest="${latest:-0.0.0}"

            # Manual runs use the dropdown. Pushes default to a patch bump,
            # overridable with #minor or #major in the commit message.
            bump="${{ inputs.bump }}"
            if [ -z "$bump" ]; then
              msg=$(git log -1 --pretty=%B)
              case "$msg" in
                *'#major'*) bump=major ;;
                *'#minor'*) bump=minor ;;
                *)          bump=patch ;;
              esac
            fi
            echo "Latest release: v$latest, bump: $bump"

            IFS='.' read -r major minor patch <<< "$latest"
            case "$bump" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              patch) patch=$((patch+1)) ;;
              *) echo "::error::unknown bump '$bump'"; exit 1 ;;
            esac

            # Step over any version already claimed by a tag, so a race or a
            # manually-created tag cannot wedge the pipeline.
            while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
              patch=$((patch+1))
            done
            version="$major.$minor.$patch"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not valid SemVer."
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

          echo "Created $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-image:
    runs-on: ubuntu-latest
    needs: [create-tag]
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign signing
      attestations: write    # actions/attest-build-provenance
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      repository: ${{ steps.version.outputs.repository }}
      registry: ${{ steps.version.outputs.registry }}
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.create-tag.outputs.tag || github.ref }}
          fetch-depth: 0     # full history so release notes can be generated

      - name: Derive version and registry
        id: version
        run: |
          set -euo pipefail
          version="${{ needs.create-tag.outputs.version }}"
          ref_name="v$version"

          # Helm chart versions must be strict SemVer with no leading 'v'.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$ref_name' is not a SemVer release tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi

          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          [ "$host" = "github.com" ] && host="ghcr.io"
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Split out so the image tag list below does not depend on
          # github.ref, which is a branch ref on a manual run.
          base="${version%%-*}"
          IFS='.' read -r v_major v_minor _ <<< "$base"
          if [ "$version" = "$base" ]; then stable=true; else stable=false; fi

          {
            echo "version=$version"
            echo "tag=$ref_name"
            echo "registry=$host"
            echo "repository=$host/$repo_lower"
            echo "major=$v_major"
            echo "minor=$v_major.$v_minor"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"
          {
            echo "REGISTRY_HOST=$host"
            echo "REPOSITORY_LOWER=$repo_lower"
            echo "VERSION=$version"
          } >> "$GITHUB_ENV"

      - name: Require Docker Hardened Images credentials
        run: |
          set -euo pipefail
          # The Dockerfile pulls its base images from dhi.io, which needs auth.
          # Fail loudly here rather than with a confusing 'FROM' error later.
          if [ -z "${DHI_USERNAME}" ] || [ -z "${DHI_TOKEN}" ]; then
            echo "::error::DHI_USERNAME/DHI_TOKEN secrets are required to pull the dhi.io base images."
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
            type=sha
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.title=quakejs-rootless
            org.opencontainers.image.description=Rootless QuakeJS server. Contains GPL-2.0-or-later engine code derived from ioquake3.
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCI registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_ACCESS_TOKEN }}

      - name: Login to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ env.DHI_TOKEN }}

      - name: Get git commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        env:
          # Suppresses the auto-uploaded '*.dockerbuild' build-record artifact.
          # It is not a zip, so anything downloading all artifacts trips over it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}:buildcache
          # mode=max records the full build graph (every stage, every build arg),
          # not just the final layer. mode=min is the default and is close to useless
          # for auditing a multi-stage build like this one.
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

      - name: Guard against an empty digest
        run: |
          set -euo pipefail
          if [ -z "${{ steps.build.outputs.digest }}" ]; then
            echo "::error::build-push-action produced no digest; refusing to continue."
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY_HOST }}/${{ env.REPOSITORY_LOWER }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        # Pinned: the repo publishes no floating 'v4' tag (tags are v4.0.0,
        # v4.1.0, v4.1.1, v4.1.2 ...).
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "ref=${{ github.ref_name }}" \
            -a "sha=${{ github.sha }}" \
            "${REGISTRY_HOST}/${REPOSITORY_LOWER}@${DIGEST}"

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Prove the signature is actually verifiable before the release is
          # announced. Without this the pipeline can publish broken signatures
          # for months without anyone noticing.
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY_HOST}/${REPOSITORY_LOWER}@${DIGEST}" > /dev/null
          echo "Signature verified."

      - name: Verify SBOM and provenance attestations are present
        run: |
          set -euo pipefail
          ref="${REGISTRY_HOST}/${REPOSITORY_LOWER}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}'       > sbom.json
          docker buildx imagetools inspect "$ref" --format '{{ json .Provenance }}' > provenance.json
          for f in sbom.json provenance.json; do
            if [ ! -s "$f" ] || [ "$(cat "$f")" = "null" ]; then
              echo "::error::$f attestation is missing from the published image."
              exit 1
            fi
          done
          echo "SBOM and provenance attestations present."

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Re-point release tags so they outrank the signature manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # GHCR shows whatever was written most recently as the package's
          # "Latest", and cosign signatures are pushed AFTER the image they
          # sign -- so the package page ends up advertising a signature as the
          # thing to docker pull. Re-writing the real tags last fixes the
          # display order.
          #
          # crane tag, not `buildx imagetools create`: imagetools REBUILDS the
          # index and can emit a different digest, which would leave these tags
          # pointing at something the signature above does not cover. crane tag
          # is a pure ref update, so the digest is preserved.
          src="${REGISTRY_HOST}/${REPOSITORY_LOWER}@${DIGEST}"
          tags="${VERSION}"
          if [ "${{ steps.version.outputs.stable }}" = "true" ]; then
            tags="$tags ${{ steps.version.outputs.minor }} ${{ steps.version.outputs.major }} latest"
          fi

          for t in $tags; do
            crane tag "$src" "$t"
          done

          # Fail loudly if any tag drifted off the signed digest.
          for t in $tags; do
            got=$(crane digest "${REGISTRY_HOST}/${REPOSITORY_LOWER}:${t}")
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::tag '$t' resolves to $got, expected $DIGEST"
              exit 1
            fi
          done
          echo "Re-pointed and verified: $tags"

      - name: Upload SBOM and provenance
        uses: actions/upload-artifact@v4
        with:
          name: image-attestations
          path: |
            sbom.json
            provenance.json

  release-chart:
    runs-on: ubuntu-latest
    needs: [release-image]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      chart_digest: ${{ steps.push.outputs.digest }}
      chart_name: ${{ steps.push.outputs.chart_name }}
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.release-image.outputs.version }}
      REGISTRY_HOST: ${{ needs.release-image.outputs.registry }}
      IMAGE_REPOSITORY: ${{ needs.release-image.outputs.repository }}
      IMAGE_DIGEST: ${{ needs.release-image.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-image.outputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Login to OCI registry for Helm
        run: |
          set -euo pipefail
          echo "${REGISTRY_ACCESS_TOKEN}" | helm registry login "${REGISTRY_HOST}" \
            -u "${{ github.actor }}" --password-stdin

      - name: Stamp chart version and pin image digest
        run: |
          set -euo pipefail
          # The git tag is the single source of truth for the chart version.
          # No querying the registry, no guessing: a given tag always produces
          # exactly one chart version, reproducibly, from a clean checkout.
          yq -i ".version = \"${VERSION}\" | .appVersion = \"${VERSION}\"" .helm/Chart.yaml
          yq -i ".image.repository = \"${IMAGE_REPOSITORY}\" | .image.tag = \"${VERSION}@${IMAGE_DIGEST}\"" .helm/values.yaml

          echo "--- Chart.yaml ---"; cat .helm/Chart.yaml
          echo "--- values.yaml image ---"; yq '.image' .helm/values.yaml

      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint .helm
          # Catch templates that lint clean but render invalid YAML.
          helm template release-check .helm > /dev/null
          helm template release-check .helm --set ingress.enabled=true > /dev/null

      - name: Package and push chart
        id: push
        run: |
          set -euo pipefail
          chart_name=$(yq -r '.name' .helm/Chart.yaml)
          chart_repo="oci://${REGISTRY_HOST}/${{ github.repository_owner }}/$(basename ${{ github.repository }})/helm"
          chart_repo=$(echo "$chart_repo" | tr '[:upper:]' '[:lower:]')

          helm package .helm --destination dist
          helm push "dist/${chart_name}-${VERSION}.tgz" "$chart_repo" 2>&1 | tee push.log

          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -n1)
          if [ -z "$digest" ]; then
            echo "::error::could not determine pushed chart digest."
            exit 1
          fi
          {
            echo "chart_name=$chart_name"
            echo "chart_repo=$chart_repo"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Login to OCI registry for cosign
        # helm registry login writes to Helm's own credential store
        # (~/.config/helm/registry/config.json). cosign reads the Docker
        # keychain (~/.docker/config.json), so it needs its own login.
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ env.REGISTRY_ACCESS_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign and verify the chart
        run: |
          set -euo pipefail
          # The chart carries the deployment topology and the image digest.
          # Signing the image but not the chart leaves the more interesting
          # half of the supply chain unprotected.
          ref="${{ steps.push.outputs.chart_repo }}/${{ steps.push.outputs.chart_name }}@${{ steps.push.outputs.digest }}"
          ref="${ref#oci://}"
          cosign sign --yes "$ref"
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$ref" > /dev/null
          echo "Chart signature verified."

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  github-release:
    runs-on: ubuntu-latest
    needs: [release-image, release-chart]
    permissions:
      contents: write     # required to create the GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged chart
        uses: actions/download-artifact@v5
        with:
          name: helm-chart
          path: artifacts

      - name: Download SBOM and provenance
        uses: actions/download-artifact@v5
        with:
          name: image-attestations
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-image.outputs.tag }}
          name: ${{ needs.release-image.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.release-image.outputs.tag, '-') }}
          files: |
            artifacts/*.tgz
            artifacts/sbom.json
            artifacts/provenance.json
          body: |
            ## Container image

            ```
            ${{ needs.release-image.outputs.repository }}:${{ needs.release-image.outputs.version }}
            ```

            Digest: `${{ needs.release-image.outputs.digest }}`

            ### Verify the signature

            ```bash
            cosign verify \
              --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ needs.release-image.outputs.repository }}@${{ needs.release-image.outputs.digest }}
            ```

            ### Verify build provenance

            ```bash
            gh attestation verify \
              oci://${{ needs.release-image.outputs.repository }}:${{ needs.release-image.outputs.version }} \
              --repo ${{ github.repository }}
            ```

            ### Install the chart

            ```bash
            helm install quake \
              oci://${{ needs.release-image.outputs.repository }}/helm/${{ needs.release-chart.outputs.chart_name }} \
              --version ${{ needs.release-image.outputs.version }}
            ```

            ---
