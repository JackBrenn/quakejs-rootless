name: CI

# Builds the image and runs the smoke test on branches and pull requests.
# Nothing is published here: release.yaml owns master, tags and signing.

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Fork PRs cannot read the DHI secrets needed to pull the base images.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint and render the Helm chart
        run: |
          helm lint .helm
          helm template ci .helm > /dev/null
          helm template ci .helm --set ingress.enabled=true > /dev/null

      - name: Login to Docker Hardened Images registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build and smoke-test the image
        run: ENGINE=docker test/smoke.sh
